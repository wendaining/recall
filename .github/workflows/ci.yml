name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            shell:
              - 'shell/**'
              - 'install.sh'
              - 'uninstall.sh'
              - 'install.ps1'
              - 'uninstall.ps1'
              - '.github/workflows/ci.yml'

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: ${{ matrix.os == 'ubuntu-latest' && 'rustfmt, clippy' || '' }}
      - uses: Swatinem/rust-cache@v2
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets
      - run: cargo test
        env:
          RUST_BACKTRACE: 1

  shell:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    name: shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y zsh fish
      # The integrations are embedded verbatim via include_str!, so the source
      # files can be checked directly without building.
      - run: |
          sh -n install.sh
          sh -n uninstall.sh
          zsh -n shell/recall.zsh
          bash -n shell/recall.bash
          fish -n shell/recall.fish
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('shell/recall.ps1', 'install.ps1', 'uninstall.ps1')) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors)
            if ($errors) {
              $errors | ForEach-Object { Write-Error "$file`: $($_.ToString())" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
