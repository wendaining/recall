name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Test
        run: cargo test

  shell-integration:
    name: shell integration syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish zsh
      - name: Build
        run: cargo build
      - name: Check generated scripts
        run: |
          ./target/debug/recall init zsh  > /tmp/recall.zsh
          ./target/debug/recall init bash > /tmp/recall.bash
          ./target/debug/recall init fish > /tmp/recall.fish
          zsh -n /tmp/recall.zsh
          bash -n /tmp/recall.bash
          fish -n /tmp/recall.fish

  windows-check:
    name: cargo check (windows, non-blocking)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check
