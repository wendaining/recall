[package]
name = "recall"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
flate2 = "1.1.9"
gethostname = "1.1.0"
memchr = "2.8.3"
portable-pty = "0.9.0"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strip-ansi-escapes = "0.2.1"
sha2 = "0.10.9"
tar = "0.4.44"
toml = "1.1.5"
ulid = { version = "3.0.0", features = ["serde"] }
unicode-width = "0.2.2"
zstd = "0.14.0"
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.182"
signal-hook = "0.4.4"

[target.'cfg(target_os = "macos")'.dependencies]
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }

[target."cfg(windows)".dependencies]
sysinfo = { version = "=0.38.0", default-features = false, features = ["system"] }
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Console"] }
